# Safehouse production stack (DESIGN.md §16) — the latest checkout, running:
#
#   pnpm docker:up
#
# That builds the image from this checkout, stamps it with the commit it came
# from, starts everything, waits for /healthz and prints which build is
# running. `pnpm docker:status` answers the same question later; the page
# footer and the server's first log line say it too. Plain `docker compose
# up -d --build` from the repo root does the same minus the stamp and the
# report, and without the first-run help below.
#
# THIS FILE SITS AT THE REPO ROOT so Compose reads the one `.env` beside it —
# by itself, no flags. It used to live in `infra/`, which made
# Compose read `infra/.env` and never the root one, and the two copies drifted
# until nobody could say which value was live. There is one `.env` now.
# `pnpm docker:up` creates it from `.env.example` on first run and generates
# the two secrets the stack refuses to start without.
#
# Services: `app` (server + built SPA) · `postgres:16` (named volume) ·
# `backup` (nightly pg_dump + file-store sync). No reverse proxy: plain HTTP on
# the LAN (§8), €0/mo, runs on the GM's laptop.
#
#   pnpm docker:logs      # follow the app
#   pnpm docker:down      # stop it (volumes — the campaign, the books — survive)
#
# WHICH AI. Chosen in the app, not here: GM console ▸ Fixer ▸ Which AI, and it
# takes effect on the next message. The `LLM_*` lines in .env only decide what
# a campaign uses until a GM has picked one there. The optional `llm` profile
# is the AWAY-GAME FALLBACK only — normally the inference box on the LAN is
# what the GM points at (decided 0.8) and this profile stays down:
#
#   pnpm docker:up --profile llm
#
# Multi-arch (§16) — build and push both platforms from the repo root:
#   docker buildx build -f infra/Dockerfile \
#     --platform linux/amd64,linux/arm64 -t safehouse/app:latest --push .
#
# ---------------------------------------------------------------------------
# THE BOOK LIBRARY, IN ONE COMMAND (FR11.7)
#
# Put your PDFs in one folder on the host and name it once in .env, as
# `BOOKS_DIR`. Relative paths resolve against THIS file's directory — the repo
# root — so the default `./books` is the `books/` folder in the checkout; an
# absolute path (`D:/books`, `/srv/books`) works too. Then:
#
#   pnpm docker:seed                      # = docker compose run --rm --build seed
#
# That is the whole procedure. The `seed` service builds from the Dockerfile's
# `seed` stage (source + tsx, none of which is in the app image), starts
# `postgres` if it is down, mounts your folder READ-ONLY at /books and the
# app's own `files` volume at /data, and runs
# `seed:books --dir /books --calibrate` — codes, measured page offsets, and
# per-page text for search and the Fixer. ~17 books / ~3,500 pages ≈ a minute.
# The PDFs land in the volume the running app already serves, so there is
# nothing to copy afterwards and no reason to stop the app first (Postgres is a
# server; the single-process rule in docs/BOOKS.md is about embedded PGlite).
# Reload the browser and the shelf is populated.
#
# Your books stay yours: mounted read-only, never copied into an image, never
# committed, never uploaded (§14). Point BOOKS_DIR at a dedicated folder if you
# would rather not expose a whole checkout to the container.
#
# Everything after `seed` goes to the seeder, so its flags work as documented
# in docs/BOOKS.md (--dir is already supplied):
#
#   pnpm docker:seed --list                    # the plan; writes nothing
#   pnpm docker:seed --only SR5 --calibrate    # one book
#
# Same service, the demo campaign instead of books (a fresh stack usually wants
# both) — only the script changes:
#
#   pnpm docker:demo
#   # = docker compose run --rm --build \
#   #     --entrypoint "pnpm --filter @safehouse/server seed:demo" seed
#
# …and the GM token CLI the same way (`pnpm docker:token --origin http://…`).
#
# `seed` sits behind the `seed` profile so `up -d` never starts it; `run`
# enables that profile by itself. The container exits when the seeding does.
#
# THE HOST-SIDE PATH STILL WORKS, if you keep a checkout with Node in it and
# prefer it: `pnpm seed:books --calibrate` against the published loopback port,
# then `docker compose cp ./data/files/. app:/data/files`. It needs Node, the
# repo, and host→container networking; the service above needs none of the
# three.
#
# STILL A ONE-SHOT FROM THE REPO: moving a campaign that started on the
# laptop's embedded database into this stack. Its source is a PGlite directory
# on the host, so this one cannot run inside the stack. Ids and sequences are
# preserved, which is exactly what a hand-rolled row copy gets wrong (see the
# script's header):
#
#   docker compose up -d postgres
#   pnpm --filter @safehouse/server exec tsx scripts/migrate-to-postgres.ts \
#     --data-dir ./data --dry-run
#   pnpm --filter @safehouse/server exec tsx scripts/migrate-to-postgres.ts \
#     --data-dir ./data \
#     --database-url postgres://safehouse:PASSWORD@127.0.0.1:5432/safehouse
#
# The script moves the database and NOT the file store — maps, token art and
# the seeded book PDFs live on disk under DATA_DIR/files and are referenced by
# `attachments.path`, so they go into the app's volume separately:
#
#   docker compose cp ./data/files/. app:/data/files

# Pinned, so the volumes are `safehouse_pgdata` / `safehouse_files` whatever
# the checkout folder is called. (When the file lived in infra/ the project
# was named `infra` after its directory; `pnpm docker:up` adopts those volumes
# the first time it runs, so nothing that was seeded is lost.)
name: safehouse

services:
  app:
    # `compose build` here produces the HOST platform, which is what the
    # laptop wants. Both platforms are built by CI and by the buildx command
    # in the header — `build.platforms` is deliberately not used, so this file
    # still parses on the older Compose that ships with Docker Desktop.
    build:
      context: .
      dockerfile: infra/Dockerfile
      # Explicit because the file has more than one final stage now: `seed`
      # sits above this one and must never be what `app` runs.
      target: runtime
      # The build stamp: `pnpm docker:up` sets both from git. A bare
      # `docker compose build` leaves them at `dev` / unset, which the page
      # then says — honestly, if unhelpfully.
      args:
        SAFEHOUSE_VERSION: ${SAFEHOUSE_VERSION:-dev}
        SAFEHOUSE_BUILT_AT: ${SAFEHOUSE_BUILT_AT:-}
    image: ${APP_IMAGE:-safehouse/app:latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    # Reach the laptop's own ports from inside the container. `127.0.0.1` in
    # here is the CONTAINER, not the host — so an inference server running on
    # the laptop (llama.cpp, vllm) is unreachable at 127.0.0.1 no matter what
    # port it is on, and the failure looks like a dead endpoint rather than a
    # config mistake. Use http://host.docker.internal:<port>/v1 as the base
    # URL, in the console or in LLM_BASE_URL. Docker Desktop and Rancher
    # provide this name already; the mapping is what makes it work on plain
    # Linux too.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PORT: 8787
      DATA_DIR: /data
      # Drizzle migrations run on container start against this (§16).
      DATABASE_URL: postgres://${POSTGRES_USER:-safehouse}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-safehouse}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      # The AI's STARTING point only. A GM's choice in the console (Fixer ▸
      # Which AI) is saved in the database and wins over these from then on;
      # unset, the AI stays off until one is made (NG7).
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL_PRIMARY: ${LLM_MODEL_PRIMARY:-}
      LLM_MODEL_FAST: ${LLM_MODEL_FAST:-}
      LLM_VISION: ${LLM_VISION:-}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Open table: any device that can reach this server may list every
      # campaign and claim its GM. Unset (the default) keeps GM recovery
      # gated on the loopback interface, which in a bridge network means
      # nobody — use `pnpm docker:token` instead. Set it only on a home network.
      SAFEHOUSE_OPEN_TABLE: ${SAFEHOUSE_OPEN_TABLE:-}
      # Origin the join QR encodes. Empty is correct here — this container
      # serves the SPA itself, so the server's own LAN address is the one a
      # phone should scan. Only a split dev setup (Vite on 5173) needs it.
      WEB_ORIGIN: ${WEB_ORIGIN:-}
    ports:
      # Bound on every interface: phones join over the venue Wi-Fi (§8).
      - "${PORT:-8787}:8787"
    volumes:
      # Maps, token art, audio, and the book PDFs — which the `seed` service
      # writes into this same volume, at this same path.
      - files:/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8787/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-safehouse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-safehouse}
      # Deterministic collation so FTS ranking does not drift between hosts.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-safehouse} -d ${POSTGRES_DB:-safehouse}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    ports:
      # LOOPBACK ONLY — the venue Wi-Fi never sees the database. `app`,
      # `backup` and `seed` reach it over the compose network and do not need
      # this. It is here for the one-shots that still run from a checkout: the
      # PGlite migration (whose source is a directory on the host) and the
      # host-side seeding path, for a GM who prefers it. Move it with
      # POSTGRES_PORT if something else on the laptop already owns 5432.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

  # One-shot seeding, run from inside the stack — the library (FR11.7) and the
  # demo campaign. See "THE BOOK LIBRARY, IN ONE COMMAND" in the header for the
  # exact invocations. Behind a profile, so `up -d` never starts it; started
  # with `run`, which enables the profile on its own and exits when the seeding
  # is done. `restart` is deliberately absent: this is a job, not a service.
  #
  # Deliberately NOT a startup dependency of `app`. Seeding is the GM's explicit
  # act, not a precondition for the table: a corrupt PDF, a mistyped BOOKS_DIR or
  # an interrupted index must never be the reason the app fails to come up on
  # game night (NG7). The library degrades to an empty shelf; the session does
  # not degrade at all.
  seed:
    profiles: ["seed"]
    build:
      context: .
      dockerfile: infra/Dockerfile
      # The build stage plus a node-owned /data — source, dev deps and tsx,
      # none of which the production image carries. That is the whole reason
      # this service exists instead of `docker compose exec app`.
      target: seed
      args:
        SAFEHOUSE_VERSION: ${SAFEHOUSE_VERSION:-dev}
        SAFEHOUSE_BUILT_AT: ${SAFEHOUSE_BUILT_AT:-}
    # Its own tag: `app` and `seed` are different images from one Dockerfile,
    # and sharing APP_IMAGE would have each overwrite the other.
    image: ${SEED_IMAGE:-safehouse/seed:latest}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATA_DIR: /data
      # The `postgres` SERVICE on compose's own network — not the published
      # loopback port. Nothing about seeding depends on host→container
      # networking any more, and migrations are applied by the seeder itself,
      # so this works against a database the app has never touched.
      DATABASE_URL: postgres://${POSTGRES_USER:-safehouse}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-safehouse}
      # `seed:demo` boots the real app in-process to seed through its own API.
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      # The SAME named volume `app` mounts, at the same path: the seeder writes
      # the PDFs straight into the running app's file store. This is what
      # replaces the old `docker compose cp ./data/files/. app:/data/files`.
      - files:/data
      # The GM's own library, READ-ONLY (§14). The seeder only ever reads these
      # files, and the owner's shelf must not be writable by a container. The
      # default is the checkout's `books/` folder; set BOOKS_DIR in .env to
      # point anywhere else.
      - ${BOOKS_DIR:-./books}:/books:ro
    # Fixed prefix + overridable tail: `run --rm seed` seeds the library with
    # calibration, `run --rm seed --list` or `--only SR5` passes the GM's own
    # flags through, and `run --entrypoint …` swaps in `seed:demo`.
    #
    # `--calibrate` alone, with no `--if-needed`: a bare `run --rm seed` is the
    # command docs/BOOKS.md §5 tells a GM to re-run when a book's offset is
    # wrong, and skipping already-indexed books would make that fix a silent
    # no-op — the exact failure mode §5 warns about.
    entrypoint: ["pnpm", "--filter", "@safehouse/server", "seed:books", "--dir", "/books"]
    command: ["--calibrate"]

  # Nightly pg_dump + file-store sync, retained 30 days (§15 data durability).
  # Sketch, deliberately: the loop and the dump are real, but "copied off-box"
  # is a bind mount the GM points at an external drive or a synced folder.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-safehouse}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      PGDATABASE: ${POSTGRES_DB:-safehouse}
      # Local time at which the nightly dump runs (HH:MM, 24h).
      BACKUP_AT: ${BACKUP_AT:-04:30}
      BACKUP_RETAIN_DAYS: ${BACKUP_RETAIN_DAYS:-30}
    volumes:
      - files:/data:ro
      - ${BACKUP_DIR:-./backups}:/backups
      - ./infra/backup.sh:/usr/local/bin/backup.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/backup.sh"]

  # Away-game fallback ONLY (profile `llm`): llama.cpp's OpenAI-compatible
  # server over a gitignored models/ folder. At home, the GM points the app at
  # the dedicated inference box instead and this never starts.
  llm:
    profiles: ["llm"]
    image: ${LLM_IMAGE:-ghcr.io/ggml-org/llama.cpp:server}
    restart: unless-stopped
    command:
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
      - "--model"
      - "/models/${LLM_MODEL_FILE:-primary.gguf}"
      - "--alias"
      - "${LLM_MODEL_PRIMARY:-safehouse-primary}"
      - "--ctx-size"
      - "${LLM_CTX_SIZE:-8192}"
      - "--parallel"
      - "2"
    volumes:
      # Models are large and licensed — gitignored, never baked into an image.
      - ./models:/models:ro
    ports:
      - "${LLM_PORT:-8080}:8080"
    # With this profile up, point the app at http://llm:8080/v1 — in the
    # console, or as LLM_BASE_URL in .env for a fresh campaign.

volumes:
  pgdata:
  files:
