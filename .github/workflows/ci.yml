name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Nothing in CI talks to a model or a Discord webhook: every AI feature has
  # to degrade cleanly with these unset (DESIGN.md NG7 / Principle 5).
  CI: 'true'

jobs:
  verify:
    name: typecheck · build · test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        # Version comes from package.json "packageManager".

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r --workspace-concurrency=1 typecheck

      - name: Build
        run: pnpm -r --workspace-concurrency=1 build

      # The shared log's regression guard, and the only check that meets a
      # database it did not create: `seed:demo` runs in a child process, exits,
      # and only then does the server open the directory it left behind.
      #
      # `ws_events.id` is a bigserial, and a serial keeps its next value in a
      # sequence BESIDE the table. Separate the two — a file-copy restore, a
      # move between backends that carries the rows and not the sequence — and
      # every append collides on a primary key the server never chose: rolls
      # commit but never broadcast, the log freezes on whatever the seeder
      # wrote, and FR2.9 is dead on a campaign that looks fine. Nothing caught
      # it, because a suite that builds its own database can never be handed
      # one in that state. So this file builds it on purpose.
      #
      # It runs ahead of everything slower because it is ten seconds and a
      # failure here invalidates every result after it.
      - name: Regression — seed in one process, serve from the next
        run: pnpm --filter @safehouse/server exec vitest run test/seeded-boot.test.ts

      # The same hazard reached the two ways a real deployment reaches it, since
      # the one above manufactures the state with `setval`:
      #   · a file-copy RESTORE of DATA_DIR — what infra/backup.sh produces, and
      #     what recovery from it looks like: copy the directory back and boot.
      #     Nothing had ever booted the server on a copied database, so the whole
      #     backup story was a shell script and a hope.
      #   · a MOVE from embedded PGlite to a DATABASE_URL Postgres with the ids
      #     preserved (apps/server/scripts/migrate-to-postgres.ts), which is the
      #     upgrade path the compose stack implies and had no script at all.
      # The driver hop needs a real server, so that block skips here and runs in
      # the `restore-postgres` job below; everything else runs on any machine.
      - name: Regression — restore a copied DATA_DIR and boot on it
        run: pnpm --filter @safehouse/server exec vitest run test/restore-boot.test.ts

      # No Docker, no testcontainers: the server suites boot a throwaway PGlite
      # per file under a temp DATA_DIR (BUILD_CONVENTIONS, "Ports, env, database").
      - name: Test
        run: pnpm -r --workspace-concurrency=1 test

      - name: Smoke — boot the server and play through it
        run: node .github/scripts/smoke.mjs

      # The browser suite (apps/web/e2e). It catches what the API-level
      # playthrough structurally cannot: mount-time hydration (LIVE-1), the
      # sheet↔dialog↔record pool parity (LIVE-2), and `/join/:code` serving the
      # join screen rather than JSON (LIVE-3).
      #
      # `continue-on-error` on the download, plus the guard in e2e/run.mjs, is
      # deliberate: a runner that cannot fetch the browser binary SKIPS the
      # suite with a message instead of turning CI red for a network problem.
      - name: Install chromium for Playwright
        continue-on-error: true
        run: pnpm --filter @safehouse/web exec playwright install --with-deps chromium

      - name: E2E — drive the real SPA in a browser
        run: pnpm --filter @safehouse/web e2e
        env:
          # `Build` above already produced apps/web/dist and apps/server/dist.
          SAFEHOUSE_E2E_NO_BUILD: '1'

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e
          path: apps/web/test-results
          if-no-files-found: ignore
          retention-days: 7

  # The half of the deployment story that needs a server the laptop does not
  # have: moving a campaign off embedded PGlite onto a real Postgres, ids and
  # sequences intact. `restore-boot.test.ts` skips that block when
  # SAFEHOUSE_TEST_DATABASE_URL is unset — which is every developer machine, by
  # design (BUILD_CONVENTIONS: tests never require Docker) — so this job is the
  # one place it actually runs, over node-postgres instead of PGlite.
  #
  # Independent of `verify`: it proves a different thing and a failure here
  # should read as "the move is broken", not "the build is broken".
  restore-postgres:
    name: PGlite → Postgres move
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: safehouse
          POSTGRES_PASSWORD: safehouse
          POSTGRES_DB: safehouse_move_test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U safehouse -d safehouse_move_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Workspace packages resolve to dist/, so the server's three dependencies
      # (contracts, rules, db) have to exist before vitest loads anything.
      - name: Build the server's workspace dependencies
        run: pnpm --filter "@safehouse/server^..." --workspace-concurrency=1 build

      - name: Restore, then move the campaign into Postgres
        run: pnpm --filter @safehouse/server exec vitest run test/restore-boot.test.ts
        env:
          # A throwaway database from the service above — the suite resets its
          # `public` and `drizzle` schemas before the move, which is safe here
          # and is why the variable is named for tests rather than DATABASE_URL.
          SAFEHOUSE_TEST_DATABASE_URL: postgres://safehouse:safehouse@localhost:5432/safehouse_move_test

  # The two §15 numbers nothing measured until now: roll-to-visible latency and
  # the Grid frame budget with 60 tokens (§17.4). Both were named in
  # BUILD_REPORT §6 as "the two NFRs no test would catch regressing".
  #
  # `continue-on-error` is the point of the job, not a concession. A timing
  # number from a shared runner is noisy in a way a correctness assertion is
  # not, and a perf check that can turn `main` red on a busy afternoon gets
  # switched off within a week — at which point it measures nothing at all. So
  # this job PRINTS the numbers on every push and never blocks a merge. A
  # regression shows up as a job that went from green to orange with the before
  # and after in its log, which is what anyone would actually act on.
  #
  # Independent of `verify`, because it answers a different question and its
  # failure means something different. Note the latency suite ALSO runs inside
  # `verify`'s `pnpm -r test`, where it does gate: its budget has ~35× headroom,
  # so it can afford to. The browser harness cannot, and skips itself unless
  # SAFEHOUSE_PERF is set.
  perf:
    name: perf — the §15 numbers (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -r --workspace-concurrency=1 build

      # p50/p95/p99 from `roll.request` received to `roll.created` on the wire,
      # over 200 serial rolls with six sockets in the room. Excludes the network
      # and the browser — the file's header says so, and so does its output.
      - name: Latency — roll to visible on every client (§15)
        run: pnpm --filter @safehouse/server exec vitest run test/latency.test.ts

      # Same guard as `verify`: a runner that cannot fetch the browser binary
      # must not turn this orange for a network problem.
      - name: Install chromium for Playwright
        continue-on-error: true
        run: pnpm --filter @safehouse/web exec playwright install --with-deps chromium

      # Frame times over the scripted 60-token scene, on a laptop-sized and a
      # phone-sized canvas, against an empty-page control taken in the same
      # browser so the log can show what is the renderer and what is the runner.
      - name: Grid — frame budget with 60 tokens and fog (§15 / §17.4)
        run: pnpm --filter @safehouse/web e2e -- perf.spec.ts
        env:
          SAFEHOUSE_PERF: '1'
          # `Build` above already produced both dists.
          SAFEHOUSE_E2E_NO_BUILD: '1'
          # Its own port: this job may run alongside `verify`, which holds 8791.
          SAFEHOUSE_E2E_PORT: '8793'

      - name: Upload perf traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-perf
          path: apps/web/test-results
          if-no-files-found: ignore
          retention-days: 7

  # Multi-arch by construction (§16): a dependency with an x86-only native
  # binary must fail the build here, not at the venue. Build only — publishing
  # is a tagged manual action, and the laptop builds its own image locally.
  image:
    name: image (amd64 + arm64)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build both platforms
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          tags: safehouse/app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
